[package]
name = "ai_gateway_router"
version = "0.2.0"
edition = "2021"
description = "High-performance AI model routing library with load balancing, fallback, and conditional routing"
license = "MIT"
repository = "https://github.com/pkmdev-sec/rust-ai-gateway"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rand = "0.8"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
axum = { version = "0.7", features = ["macros"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
napi = { version = "2.0", optional = true }
napi-derive = { version = "2.0", optional = true }

[features]
default = ["async", "simple", "uuid"]
async = ["tokio", "reqwest"]
simple = []
server = ["async", "axum", "tower", "tower-http", "uuid", "chrono"]
nodejs = ["napi", "napi-derive"]
full = ["async", "simple", "server", "nodejs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tokio-test = "0.4"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "intelligent-server"
path = "src/bin/intelligent-server.rs"
required-features = ["server"]